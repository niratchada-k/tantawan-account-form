<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCS SunFlow</title>
  <link rel="icon" type="image/x-icon" href="icon_E2.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600&display=swap">
  <link rel="stylesheet" href="from-style.css">
</head>
<body>
 
  <!-- พื้นหลัง: ดาวกระพริบ + ก้อนสีเบลอ -->
  <canvas id="sky"></canvas>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
  <div class="blob d"></div>
  <div class="blob e"></div>
 
  <div class="page">
    <main class="card">
 
      <!-- หัวเว็บ: โลโก้ / ชื่อ / ไฟสถานะน้องบอท / ปุ่มเปลี่ยนธีม -->
      <header>
        <img class="logo" src="logo.svg" alt="">
        <h1>TCS SunFlow<small>เรียงข้อมูลทางบัญชี</small></h1>
        <span class="botlight" id="botLight">⚪ ระบบยังไม่เปิด</span>
        <button class="btn" id="themeBtn" type="button">🌙 โหมดมืด</button>
      </header>
 
      <!-- ช่องลากไฟล์ (น้องบอทใช้กรอบนี้เป็นจุดอ้างอิงหน้าเว็บ ถ้าจะแก้ ต้องชี้ใหม่ใน UiPath) -->
      <section class="drop" id="drop">
        <p>
          <strong>ลากไฟล์ Excel ที่ export จากโปรแกรมเดิมมาวางตรงนี้</strong><br>
          <span id="src">ยังไม่มีข้อมูล · เว็บอ่านไฟล์ในเครื่องนี้ ไม่ส่งไฟล์ออกไปไหน</span>
        </p>
        <label class="btn" for="file">📂 เลือกไฟล์</label>
        <input id="file" type="file" accept=".xlsx,.xls" hidden>
      </section>
 
      <!-- ปุ่มกรอง / ค้นหา / กลุ่มรหัส -->
      <div class="tools">
        <div class="tools" id="chips"></div>
        <input class="search" type="search" id="q" placeholder="🔍 ค้นหารหัสหรือชื่อ">
        <select class="search" id="prefix" aria-label="กลุ่มรหัส">
          <option value="">ทุกกลุ่มรหัส</option>
        </select>
      </div>
 
      <!-- ตารางข้อมูล (แถวสร้างด้วย JS) -->
      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>รหัส</th>
              <th class="w-name">ชื่อ-นามสกุล</th>
              <th class="w-addr">ที่อยู่</th>
              <th class="w-tax">เลขประจำตัวผู้เสียภาษี</th>
              <th>สถานะ</th>
              <th>ลบ</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
 
      <!-- แถบล่าง: สรุป / จำนวนที่แสดง / ปุ่ม -->
      <div class="foot">
        <div class="msg" id="footmsg"></div>
        <div class="pager" id="pager"></div>
        <button class="btn danger" id="clearAll" type="button">🗑️ ล้างข้อมูล</button>
        <button class="btn liquid" id="send" type="button">🌻 บันทึกลง Excel</button>
      </div>
 
    </main>
  </div>
 
  <!-- ป๊อปอัปยืนยัน / เตือน -->
  <div class="modal" id="modal" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="ico" id="mIco">⚠️</div>
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <div class="row">
        <button class="btn liquid" id="mOk" type="button">ตกลง</button>
        <button class="btn" id="mCancel" type="button">ยกเลิก</button>
      </div>
    </div>
  </div>
 
  <!-- แจ้งเตือนสั้น ๆ ด้านบน -->
  <div class="toast" id="toast" role="status"></div>
 
  <!-- กล่องซ่อน "ตู้ไปรษณีย์" ให้น้องบอทหยิบงาน / วางผล (ห้ามลบ) -->
  <div id="sunflowBridge" hidden></div>
 
  <!-- อ่านไฟล์ Excel ในเบราว์เซอร์ (SheetJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="from-script.js"></script>
</body>
</html>
