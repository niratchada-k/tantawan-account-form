    <h1>TCS SunFlow<small>เรียงข้อมูลทางบัญชี</small></h1>
    <button class="btn theme" id="themeBtn" type="button">🌙 เปลี่ยนธีม</button>
  </header>

  <section class="drop" id="drop">
    <p><strong>ลากไฟล์ Excel ที่ export จากโปรแกรมเดิมมาวางตรงนี้</strong> <span style="color:var(--muted)">(ชื่อไฟล์อะไรก็ได้ .xlsx / .xls)</span><br>
      <span id="src">ยังไม่มีข้อมูล · เว็บอ่านไฟล์ในเครื่องนี้ ไม่ส่งไฟล์ออกไปไหน</span></p>
    <label class="btn" for="file">📂 เลือกไฟล์</label>
    <input id="file" type="file" accept=".xlsx,.xls" hidden>
  </section>

  <div class="tools">
    <div class="tools" id="chips"></div>
    <input class="search" type="search" id="q" placeholder="🔍 ค้นหารหัสหรือชื่อ">
    <select class="search" id="prefix" aria-label="กลุ่มรหัส"><option value="">ทุกกลุ่มรหัส</option></select>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr>
        <th>รหัส<span class="col"></span></th>
        <th style="width:24%">ชื่อ-นามสกุล<span class="col"></span></th>
        <th style="width:38%">ที่อยู่<span class="col"></span></th>
        <th style="width:200px">เลขประจำตัวผู้เสียภาษี<span class="col"></span></th>
        <th>สถานะ</th>
        <th><span class="col">ลบ</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="foot">
    <div class="msg" id="footmsg"></div>
    <div class="pager" id="pager"></div>
    <button class="btn danger" id="clearAll" type="button">🗑️ ล้างทุกข้อมูล</button>
    <button class="btn" id="clearDone" type="button">🧹 ล้างข้อมูลที่ครบแล้ว</button>
    <button class="btn liquid" id="send" type="button">🌻 ส่งให้น้องบอท</button>
  </div>
</main></div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="ico" id="mIco">⚠️</div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="row"><button class="btn liquid" id="mOk" type="button">ตกลง</button><button class="btn" id="mCancel" type="button">ยกเลิก</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
