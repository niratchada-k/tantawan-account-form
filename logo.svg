<!-- โลโก้ TCS SunFlow
     กลีบนอก 14 + กลีบใน 14 หมุนรอบจุดกลางทีละ 25.7° / ใจกลางสีน้ำตาล / เมล็ด 69 เม็ดเรียงแบบมุมทองคำ (137.5°) เหมือนดอกทานตะวันจริง -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sunStroke" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="470" y2="470">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#f08dbd"/>
    </linearGradient>
    <path id="petalOuter" d="M0,-80 C60,-140.8 33,-226 0,-240 C-33,-226 -60,-140.8 0,-80 Z"
          fill="#fff1c4" stroke="url(#sunStroke)" stroke-width="8" stroke-linejoin="round"/>
    <path id="petalInner" d="M0,-80 C56,-128.64 30.8,-194 0,-208 C-30.8,-194 -56,-128.64 0,-80 Z"
          fill="#ffd98a" stroke="url(#sunStroke)" stroke-width="8" stroke-linejoin="round"/>
  </defs>

  <!-- กลีบนอก (เริ่ม 12.86° แล้วเพิ่มทีละ 25.71°) -->
  <g transform="translate(256 256)">
    <use href="#petalOuter" transform="rotate(12.86)"/>
    <use href="#petalOuter" transform="rotate(38.57)"/>
    <use href="#petalOuter" transform="rotate(64.29)"/>
