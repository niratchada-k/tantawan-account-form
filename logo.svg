    <use href="#petalOuter" transform="rotate(321.43)"/>
    <use href="#petalOuter" transform="rotate(347.14)"/>
  </g>

  <!-- กลีบใน (เริ่ม 0° เหลื่อมกับกลีบนอก) -->
  <g transform="translate(256 256)">
    <use href="#petalInner" transform="rotate(0.00)"/>
